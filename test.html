<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>Attendance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @supports (padding: max(0px)) {
      .safe-pt { padding-top: max(1rem, env(safe-area-inset-top)); }
      .safe-pb { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
      .safe-pl { padding-left: max(1rem, env(safe-area-inset-left)); }
      .safe-pr { padding-right: max(1rem, env(safe-area-inset-right)); }
    }
    .touch-btn { touch-action: manipulation; }
    .touch-btn:active { transform: scale(0.98); }
    input, button { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 safe-pt safe-pb safe-pl safe-pr flex flex-col items-center justify-center">

  <div id="attendanceCard" class="max-w-[92vw] max-w-md w-full bg-white p-5 sm:p-6 rounded-xl shadow-md">
    <img 
      src="logo.svg" 
      alt="Logo" 
      onerror="this.style.display='none'"
      class="mx-auto h-20 w-auto mb-3 object-contain"
    />
    <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 text-center mb-1">Attendance</h1>
    <p class="text-xs text-gray-500 text-center mb-4">Enter your details and submit to record attendance.</p>

    <div id="sessionInfo" class="bg-blue-50 border border-blue-200 rounded-lg px-4 py-3 mb-4 text-sm text-blue-900 space-y-0.5"></div>

    <div id="statusMessage" class="hidden p-4 rounded-lg mb-4 text-sm font-medium"></div>

    <form id="attendanceForm" onsubmit="event.preventDefault(); processAttendance();" class="space-y-5">
      <div>
        <label for="studentName" class="block text-base font-medium text-gray-700 mb-1.5">Full Name</label>
        <input 
          type="text" 
          id="studentName" 
          required 
          placeholder="Your Name" 
          autocomplete="name"
          inputmode="text"
          enterkeyhint="next"
          style="font-size:16px"
          class="w-full px-4 py-3.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus-visible:ring-2"
        />
      </div>

      <div>
        <label for="rollNo" class="block text-base font-medium text-gray-700 mb-1.5">Roll Number</label>
        <input 
          type="text" 
          id="rollNo" 
          required 
          placeholder="B26.../IM26..." 
          autocomplete="organization"
          inputmode="alphanumeric"
          enterkeyhint="done"
          style="font-size:16px"
          class="w-full px-4 py-3.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus-visible:ring-2"
        />
      </div>

      <div class="border-t-2 border-gray-200 pt-5">
        <h2 class="text-lg font-bold text-gray-800 mb-1">Induction Week Feedback</h2>
        <p class="text-xs text-gray-500 mb-4">Help us improve GCS with your honest feedback.</p>

        <div class="mb-5">
          <label class="block text-base font-medium text-gray-700 mb-2">1. Overall experience of sessions and events</label>
          <div id="ratingStars" class="flex gap-1 text-3xl select-none" role="radiogroup" aria-label="Overall experience rating">
            <button type="button" data-rating="1" aria-label="1 star" class="text-gray-300 touch-btn focus:outline-none focus:ring-2 focus:ring-amber-400 rounded-md transition-colors">★</button>
            <button type="button" data-rating="2" aria-label="2 stars" class="text-gray-300 touch-btn focus:outline-none focus:ring-2 focus:ring-amber-400 rounded-md transition-colors">★</button>
            <button type="button" data-rating="3" aria-label="3 stars" class="text-gray-300 touch-btn focus:outline-none focus:ring-2 focus:ring-amber-400 rounded-md transition-colors">★</button>
            <button type="button" data-rating="4" aria-label="4 stars" class="text-gray-300 touch-btn focus:outline-none focus:ring-2 focus:ring-amber-400 rounded-md transition-colors">★</button>
            <button type="button" data-rating="5" aria-label="5 stars" class="text-gray-300 touch-btn focus:outline-none focus:ring-2 focus:ring-amber-400 rounded-md transition-colors">★</button>
          </div>
          <input type="hidden" id="ratingValue" value="" />
          <p id="ratingLabel" class="text-xs text-gray-400 mt-1">Tap the stars to rate (1 = Poor, 5 = Excellent)</p>
        </div>

        <div class="mb-4">
          <label for="feedbackExperience" class="block text-base font-medium text-gray-700 mb-1.5">1. Comments on your overall experience</label>
          <textarea 
            id="feedbackExperience" 
            required 
            rows="3"
            placeholder="Share your overall experience of the sessions and events..."
            style="font-size:16px"
            class="w-full px-4 py-3.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus-visible:ring-2 resize-y"
          ></textarea>
        </div>

        <div class="mb-4">
          <label for="feedbackTopics" class="block text-base font-medium text-gray-700 mb-1.5">2. Topics and content you explored</label>
          <textarea 
            id="feedbackTopics" 
            required 
            rows="3"
            placeholder="List the topics, talks, or content you explored this week..."
            style="font-size:16px"
            class="w-full px-4 py-3.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus-visible:ring-2 resize-none"
          ></textarea>
        </div>

        <div class="mb-4">
          <label for="feedbackLearned" class="block text-base font-medium text-gray-700 mb-1.5">3. What have you learned in this induction week?</label>
          <textarea 
            id="feedbackLearned" 
            required 
            rows="3"
            placeholder="Summarise key takeaways from your first week..."
            style="font-size:16px"
            class="w-full px-4 py-3.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus-visible:ring-2 resize-none"
          ></textarea>
        </div>

        <div class="mb-4">
          <label for="feedbackServices" class="block text-base font-medium text-gray-700 mb-1.5">4. How do you feel about GCS services (Sessions, Mentors, and Services)?</label>
          <textarea 
            id="feedbackServices" 
            required 
            rows="3"
            placeholder="Your feedback on GCS sessions, mentors, and services..."
            style="font-size:16px"
            class="w-full px-4 py-3.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus-visible:ring-2 resize-none"
          ></textarea>
        </div>
      </div>

      <button 
        type="submit" 
        id="submitBtn" 
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 rounded-lg transition duration-200 touch-btn"
      >
        Submit Attendance
      </button>
    </form>
  </div>

  <footer class="mt-10 w-full text-center">
    <p class="text-xs text-gray-400">Developed by GCS IIT Mandi</p>
  </footer>

  <script>
    const SESSION_COURSE = "A session on Anti Ragging and Drug Abuse Awareness";   
    const SESSION_DATE = "August 9, 2026";          
    const SESSION_INSTRUCTOR = "Adv. Anil Guleria";

    // Classroom Geofence Target
    const CLASSROOM_LAT = 31.780950875312186;         
    const CLASSROOM_LON = 76.9940189971676;       
    const MAX_ALLOWED_METERS = 20000; 
    
    // Google Form Entries
    const FORM_ACTION_URL = "https://docs.google.com/forms/d/e/1FAIpQLSc8eSx6CFNCvpDHm17y1aZXVWhva36L5Mfy9THEs46QbBphYA/formResponse";
    const NAME_ENTRY_ID = "entry.1117495639"; 
    const ROLL_ENTRY_ID = "entry.1436124716"; 
    const DISTANCE_ENTRY_ID = "entry.122898561"; 
    // TODO: Replace with real Google Form entry IDs for the feedback questions
    const RATING_ENTRY_ID = "entry.1984524683"; 
    const FEEDBACK_EXPERIENCE_ENTRY_ID = "entry.629036836"; 
    const FEEDBACK_TOPICS_ENTRY_ID = "entry.966158937"; 
    const FEEDBACK_LEARNED_ENTRY_ID = "entry.1965713805"; 
    const FEEDBACK_SERVICES_ENTRY_ID = "entry.1869268243"; 

    const LOCK_KEY = "attendanceSubmitted";

    function renderSessionInfo() {
      const sessionInfo = document.getElementById("sessionInfo");
      sessionInfo.innerHTML = `
        <p class="flex justify-between"><span class="font-medium text-blue-700">Session</span><span>${SESSION_COURSE}</span></p>
        <p class="flex justify-between"><span class="font-medium text-blue-700">Date</span><span>${SESSION_DATE}</span></p>
        <p class="flex justify-between"><span class="font-medium text-blue-700">Instructor</span><span>${SESSION_INSTRUCTOR}</span></p>
      `;
    }

    function getAttendanceLock() {
      try {
        const raw = localStorage.getItem(LOCK_KEY);
        if (!raw) return null;
        const lock = JSON.parse(raw);
        if (lock.course === SESSION_COURSE && lock.date === SESSION_DATE) return lock;
      } catch (e) {}
      return null;
    }

    function lockAttendance(name, rollNo) {
      try {
        localStorage.setItem(LOCK_KEY, JSON.stringify({
          course: SESSION_COURSE,
          date: SESSION_DATE,
          name: name,
          rollNo: rollNo
        }));
      } catch (e) {}
    }

    function renderLockedScreen(lock) {
      document.getElementById("attendanceCard").innerHTML = `
        <div class="text-center py-6">
          <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl font-bold">🔒</div>
          <h2 class="text-xl font-bold text-gray-800 mb-1">Attendance Already Recorded</h2>
          <p class="text-sm text-gray-600">Session: <span class="font-semibold">${lock.course}</span></p>
          <p class="text-sm text-gray-600">Date: <span class="font-semibold">${lock.date}</span></p>
          <p class="text-sm text-gray-600">Name: <span class="font-semibold">${lock.name}</span></p>
          <p class="text-sm text-gray-600">Roll No: <span class="font-semibold">${lock.rollNo}</span></p>
          <p class="text-xs text-gray-400 mt-3">This session has been locked for this browser.</p>
        </div>
      `;
    }

    const existingLock = getAttendanceLock();
    if (existingLock) {
      renderLockedScreen(existingLock);
    } else {
      renderSessionInfo();
      initRatingWidget();
    }

    function initRatingWidget() {
      const stars = document.querySelectorAll("#ratingStars [data-rating]");
      const hiddenInput = document.getElementById("ratingValue");
      const label = document.getElementById("ratingLabel");

      function paint(value) {
        stars.forEach((star) => {
          const v = parseInt(star.dataset.rating, 10);
          star.classList.toggle("text-amber-400", v <= value);
          star.classList.toggle("text-gray-300", v > value);
        });
      }

      stars.forEach((star) => {
        star.addEventListener("click", () => {
          const value = parseInt(star.dataset.rating, 10);
          hiddenInput.value = value;
          label.textContent = value === 1 ? "Poor" : value === 2 ? "Fair" : value === 3 ? "Good" : value === 4 ? "Very Good" : "Excellent";
          label.classList.add("font-medium", "text-amber-600");
          paint(value);
        });
      });
    }

    function processAttendance() {
      const name = document.getElementById("studentName").value.trim();
      const rollNo = document.getElementById("rollNo").value.trim();
      const submitBtn = document.getElementById("submitBtn");

      if (getAttendanceLock()) {
        showMessage("Attendance for this session has already been recorded.", "error");
        return;
      }

      if (!name || !rollNo) {
        showMessage("Please fill in both Name and Roll Number.", "error");
        return;
      }

      const rating = document.getElementById("ratingValue").value;
      if (!rating) {
        showMessage("Please rate your overall experience (tap the stars).", "error");
        return;
      }

      const feedback = {
        experience: document.getElementById("feedbackExperience").value.trim(),
        topics: document.getElementById("feedbackTopics").value.trim(),
        learned: document.getElementById("feedbackLearned").value.trim(),
        services: document.getElementById("feedbackServices").value.trim()
      };

      if (!feedback.experience || !feedback.topics || !feedback.learned || !feedback.services) {
        showMessage("Please answer all 4 feedback questions before submitting.", "error");
        return;
      }

      if (!navigator.geolocation) {
        showMessage("Geolocation is mandatory to verify presence in the classroom. Submission blocked.", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.classList.add("opacity-50", "cursor-not-allowed");
      showMessage("Acquiring high-precision GPS location...", "info");

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const userLat = pos.coords.latitude;
          const userLon = pos.coords.longitude;
          const userAccuracy = Math.round(pos.coords.accuracy); // Device accuracy margin in meters
          const distanceMeters = Math.round(getDistance(CLASSROOM_LAT, CLASSROOM_LON, userLat, userLon));

          // Distance Geofence Check
          if (distanceMeters > MAX_ALLOWED_METERS) {
            showMessage(`Attendance Blocked! You are ${distanceMeters}m away from the classroom (Max allowed: ${MAX_ALLOWED_METERS}m). Margin: ±${userAccuracy}m.`, "error");
            resetButton();
            return;
          }

          // Location verified -> Submit data with GPS & Accuracy metrics
          showMessage(`Location verified (${distanceMeters}m away, ±${userAccuracy}m accuracy). Submitting...`, "info");
          
          sendDirectToGoogleForms(name, rollNo, `${distanceMeters}m away (±${userAccuracy}m accuracy)`, rating, feedback);
        },
        (err) => {
          showMessage("Location permission denied or timed out. You must allow GPS access to record attendance.", "error");
          resetButton();
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    function sendDirectToGoogleForms(name, rollNo, distanceText, rating, feedback) {
      const formData = new FormData();
      formData.append(NAME_ENTRY_ID, name);
      formData.append(ROLL_ENTRY_ID, rollNo);
      formData.append(DISTANCE_ENTRY_ID, distanceText);
      formData.append(RATING_ENTRY_ID, rating);
      formData.append(FEEDBACK_EXPERIENCE_ENTRY_ID, feedback.experience);
      formData.append(FEEDBACK_TOPICS_ENTRY_ID, feedback.topics);
      formData.append(FEEDBACK_LEARNED_ENTRY_ID, feedback.learned);
      formData.append(FEEDBACK_SERVICES_ENTRY_ID, feedback.services);

      fetch(FORM_ACTION_URL, {
        method: "POST",
        mode: "no-cors", 
        body: formData
      })
      .then(() => renderSuccessScreen(name, rollNo, distanceText))
      .catch((err) => {
        console.error(err);
        showMessage("Failed to submit attendance. Please try again.", "error");
        resetButton();
      });
    }

    function renderSuccessScreen(name, rollNo, distanceText) {
      lockAttendance(name, rollNo);

      document.getElementById("attendanceCard").innerHTML = `
        <div class="text-center py-6">
          <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl font-bold">✓</div>
          <h2 class="text-xl font-bold text-gray-800 mb-1">Attendance Recorded!</h2>
          <p class="text-sm text-gray-600">Session: <span class="font-semibold">${SESSION_COURSE}</span></p>
          <p class="text-sm text-gray-600">Name: <span class="font-semibold">${name}</span></p>
          <p class="text-sm text-gray-600">Roll No: <span class="font-semibold">${rollNo}</span></p>
          <p class="text-xs text-green-600 mt-2 font-medium">GPS Verified (${distanceText})</p>
        </div>
      `;
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const rad = Math.PI / 180;
      const dLat = (lat2 - lat1) * rad;
      const dLon = (lon2 - lon1) * rad;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function showMessage(msg, type) {
      const statusDiv = document.getElementById("statusMessage");
      statusDiv.classList.remove("hidden", "bg-red-100", "text-red-800", "bg-green-100", "text-green-800", "bg-blue-100", "text-blue-800");

      if (type === "error") {
        statusDiv.classList.add("bg-red-100", "text-red-800");
      } else if (type === "success") {
        statusDiv.classList.add("bg-green-100", "text-green-800");
      } else {
        statusDiv.classList.add("bg-blue-100", "text-blue-800");
      }

      statusDiv.innerText = msg;
    }

    function resetButton() {
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = false;
      submitBtn.classList.remove("opacity-50", "cursor-not-allowed");
    }
  </script>
</body>
</html>
